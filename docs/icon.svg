<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e30"/>
      <stop offset="1" stop-color="#1f8f85"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#dff4f1" stop-opacity="0.96"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  <!-- three stacked drive bays -->
  <g>
    <rect x="104" y="120" width="304" height="76" rx="22" fill="url(#bay)"/>
    <rect x="104" y="218" width="304" height="76" rx="22" fill="url(#bay)"/>
    <rect x="104" y="316" width="304" height="76" rx="22" fill="url(#bay)"/>
  </g>
  <!-- slots -->
  <g fill="#1b1e30" fill-opacity="0.55">
    <rect x="140" y="150" width="140" height="16" rx="8"/>
    <rect x="140" y="248" width="140" height="16" rx="8"/>
    <rect x="140" y="346" width="140" height="16" rx="8"/>
  </g>
  <!-- status LEDs -->
  <g>
    <circle cx="350" cy="158" r="17" fill="#26a69a"/>
    <circle cx="350" cy="256" r="17" fill="#26a69a"/>
    <circle cx="350" cy="354" r="17" fill="#ffa726"/>
  </g>
</svg>
